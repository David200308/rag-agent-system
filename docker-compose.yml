version: '3.8'

services:

  # ── Vector store ──────────────────────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: agent-system-weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    restart: on-failure:0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
      LOG_LEVEL: 'info'
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Relational DB (auth: email whitelist; OTP codes live in Redis, JWT is stateless) ──
  mysql:
    image: mysql:latest
    container_name: agent-system-mysql
    ports:
      - "3306:3306"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DB:-ragagent}
      MYSQL_USER: ${MYSQL_USER:-ragagent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ragagent}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot backend (agent-system-rest module) ────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: agent-system-rest/Dockerfile
    container_name: agent-system-backend
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification:
        condition: service_healthy
    environment:
      # ── Database
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-ragagent}
      MYSQL_USER: ${MYSQL_USER:-ragagent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ragagent}
      # ── Redis (rate limiting, sandbox tracking, fallback cache — shared with scheduler's Asynq queue)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # ── Weaviate
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: 8080
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-}
      # ── LLM provider (openai | anthropic | openrouter | local)
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-6}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://host.docker.internal:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-nomic-embed-text}
      # ── Auth
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-changeme-use-a-long-random-base64-string-in-production}
      AUTH_JWT_EXPIRY_HOURS: ${AUTH_JWT_EXPIRY_HOURS:-24}
      AUTH_OTP_EXPIRY_MINUTES: ${AUTH_OTP_EXPIRY_MINUTES:-10}
      AUTH_EMAIL_ENCRYPTION_KEY: ${AUTH_EMAIL_ENCRYPTION_KEY:-changeme-use-a-32-byte-base64-key-in-production}
      # ── Admin (comma-separated emails allowed to manage orgs system-wide)
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # ── MCP transport auth (blank = /mcp/** closed)
      MCP_API_KEY: ${MCP_API_KEY:-}
      MCP_EMAIL: ${MCP_EMAIL:-}
      # ── Client identity (set CLIENT_IDENTITY_ENABLED=true to enforce)
      CLIENT_IDENTITY_ENABLED: ${CLIENT_IDENTITY_ENABLED:-false}
      CLIENT_IOS_SECRET: ${CLIENT_IOS_SECRET:-changeme-ios-shared-secret}
      CLIENT_WEB_SECRET: ${CLIENT_WEB_SECRET:-changeme-web-shared-secret}
      # ── Financial / Market data
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      # ── Travel (no API keys — records stored in MySQL, map tiles via CartoDB)
      # ── Web fetch
      WEB_FETCH_ENABLED: ${WEB_FETCH_ENABLED:-true}
      WEB_FETCH_TIMEOUT: ${WEB_FETCH_TIMEOUT:-10}
      WEB_FETCH_MAX_CHARS: ${WEB_FETCH_MAX_CHARS:-50000}
      # ── Scheduler
      SCHEDULER_URL: http://scheduler:8082
      SCHEDULER_SERVICE_KEY: ${SCHEDULER_SERVICE_KEY:-scheduler-secret-key}
      # ── Image storage (agent-system-storage-inner, Garage-backed)
      STORAGE_URL: http://storage:8083
      STORAGE_SERVICE_KEY: ${STORAGE_SERVICE_KEY:-storage-secret-key}
      # ── Notifications (agent-system-notification-inner, Resend-backed email)
      NOTIFICATION_URL: http://notification:8084
      NOTIFICATION_SERVICE_KEY: ${NOTIFICATION_SERVICE_KEY:-notification-secret-key}
      # ── Connectors (Google Workspace + Figma OAuth + Telegram Bot)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FIGMA_CLIENT_ID: ${FIGMA_CLIENT_ID:-}
      FIGMA_CLIENT_SECRET: ${FIGMA_CLIENT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      CONNECTOR_CALLBACK_BASE_URL: ${CONNECTOR_CALLBACK_BASE_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  # ── Redis — shared by the Go scheduler (Asynq queue) and the Java backend
  #    (rate-limit buckets, sandbox container tracking, fallback answer cache) ──
  redis:
    image: redis:7-alpine
    container_name: agent-system-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Garage (S3-compatible object storage for images) ──────────────────────────
  # garage.toml is rendered from observability/garage/garage.toml.template by
  # setup.sh (embeds the generated rpc_secret/admin_token). S3 API (3900) and
  # admin API (3903) stay on the internal docker network only.
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: agent-system-garage
    restart: unless-stopped
    volumes:
      - ./observability/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Image storage microservice (agent-system-storage-inner module) ───────────
  storage:
    build:
      context: ./backend
      dockerfile: agent-system-storage-inner/Dockerfile
    container_name: agent-system-storage
    ports:
      - "8083:8083"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-ragagent}
      MYSQL_USER: ${MYSQL_USER:-ragagent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ragagent}
      STORAGE_SERVICE_KEY: ${STORAGE_SERVICE_KEY:-storage-secret-key}
      GARAGE_S3_ENDPOINT: http://garage:3900
      GARAGE_REGION: ${GARAGE_REGION:-garage}
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY:-}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY:-}
      GARAGE_BUCKET: ${GARAGE_BUCKET:-agent-system-images}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ── Notification microservice (agent-system-notification-inner module) ───────
  # Email today (Resend); more channels (Telegram, push, etc.) land here later.
  notification:
    build:
      context: ./backend
      dockerfile: agent-system-notification-inner/Dockerfile
    container_name: agent-system-notification
    ports:
      - "8084:8084"
    restart: unless-stopped
    environment:
      NOTIFICATION_SERVICE_KEY: ${NOTIFICATION_SERVICE_KEY:-notification-secret-key}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@example.com}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  # ── Go scheduler microservice ─────────────────────────────────────────────────
  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: agent-system-scheduler
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      PORT: 8082
      REDIS_ADDR: redis:6379
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-ragagent}
      MYSQL_USER: ${MYSQL_USER:-ragagent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ragagent}
      BACKEND_URL: http://backend:8081
      SCHEDULER_SERVICE_KEY: ${SCHEDULER_SERVICE_KEY:-scheduler-secret-key}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8081
        AUTH_ENABLED: ${AUTH_ENABLED:-false}
        AUTH_JWT_EXPIRY_HOURS: ${AUTH_JWT_EXPIRY_HOURS:-24}
    container_name: agent-system-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8081
      SCHEDULER_URL: http://scheduler:8082
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_JWT_EXPIRY_HOURS: ${AUTH_JWT_EXPIRY_HOURS:-24}
      CLIENT_WEB_SECRET: ${CLIENT_WEB_SECRET:-changeme-web-shared-secret}

  # ── Prometheus (scrapes /actuator/prometheus every 15s) ──────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: agent-system-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # ── Loki (log aggregation backend) ───────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: agent-system-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  # ── Promtail (scrapes Docker container logs → Loki) ───────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: agent-system-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./observability/promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki

  # ── Grafana (dashboard UI, auto-provisions Prometheus datasource) ─────────────
  grafana:
    image: grafana/grafana:latest
    container_name: agent-system-grafana
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ID: "1"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Admin"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_GITHUB_ENABLED: "true"
      GF_AUTH_GITHUB_CLIENT_ID: ${GRAFANA_GITHUB_CLIENT_ID}
      GF_AUTH_GITHUB_CLIENT_SECRET: ${GRAFANA_GITHUB_CLIENT_SECRET}
      GF_AUTH_GITHUB_SCOPES: "user:email,read:org"
      GF_AUTH_GITHUB_AUTH_URL: "https://github.com/login/oauth/authorize"
      GF_AUTH_GITHUB_TOKEN_URL: "https://github.com/login/oauth/access_token"
      GF_AUTH_GITHUB_API_URL: "https://api.github.com/user"
      GF_AUTH_GITHUB_ALLOW_SIGN_UP: "true"
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

volumes:
  weaviate_data:
  mysql_data:
  garage_meta:
  garage_data:
  prometheus_data:
  grafana_data:
  loki_data:
