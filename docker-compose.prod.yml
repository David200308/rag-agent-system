# Production compose — uses Docker secrets for all sensitive values.
#
# Setup
# ─────
# 1. Create the secrets directory and populate each file:
#
#      mkdir -p secrets
#      echo "strong-root-password"         > secrets/mysql_root_password
#      echo "ragagent"                     > secrets/mysql_password
#      echo "sk-..."                       > secrets/openai_api_key
#      echo "$(openssl rand -base64 64)"   > secrets/auth_jwt_secret
#      echo "$(openssl rand -base64 32)"   > secrets/scheduler_service_key
#      echo "$(openssl rand -base64 32)"   > secrets/storage_service_key
#      echo "$(openssl rand -base64 32)"   > secrets/alert_service_key
#      echo "..."                          > secrets/garage_access_key   # pre-seeded via `garage key import`
#      echo "..."                          > secrets/garage_secret_key
#      # ... (see full list below)
#      chmod 600 secrets/*
#
# 2. Run:
#      docker compose -f docker-compose.prod.yml up -d --build
#
# Secret files live in ./secrets/ which is git-ignored.
# Each file name (lowercased) maps to the env var of the same name (uppercased).
# docker-entrypoint.sh in the backend image handles the conversion.

version: '3.8'

# ── Secret definitions ────────────────────────────────────────────────────────
secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_password:
    file: ./secrets/mysql_password
  weaviate_api_key:
    file: ./secrets/weaviate_api_key
  openai_api_key:
    file: ./secrets/openai_api_key
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  openrouter_api_key:
    file: ./secrets/openrouter_api_key
  auth_jwt_secret:
    file: ./secrets/auth_jwt_secret
  resend_api_key:
    file: ./secrets/resend_api_key
  resend_from_email:
    file: ./secrets/resend_from_email
  finnhub_api_key:
    file: ./secrets/finnhub_api_key
  scheduler_service_key:
    file: ./secrets/scheduler_service_key
  storage_service_key:
    file: ./secrets/storage_service_key
  alert_service_key:
    file: ./secrets/alert_service_key
  garage_access_key:
    file: ./secrets/garage_access_key
  garage_secret_key:
    file: ./secrets/garage_secret_key
  google_client_id:
    file: ./secrets/google_client_id
  google_client_secret:
    file: ./secrets/google_client_secret
  figma_client_id:
    file: ./secrets/figma_client_id
  figma_client_secret:
    file: ./secrets/figma_client_secret
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  telegram_bot_username:
    file: ./secrets/telegram_bot_username

services:

  # ── Vector store ─────────────────────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: agent-system-weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
      LOG_LEVEL: 'info'
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Relational DB ─────────────────────────────────────────────────────────────
  # MySQL natively supports *_FILE env vars for its own password config.
  mysql:
    image: mysql:latest
    container_name: agent-system-mysql
    ports:
      - "3307:3306"
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-ragagent}
      MYSQL_USER: ${MYSQL_USER:-ragagent}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u ${MYSQL_USER:-ragagent} -p\"$(cat /run/secrets/mysql_password)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Kafka (notification events: OTP + workflow-complete) ──────────────────────
  kafka:
    image: apache/kafka:3.9.2
    container_name: agent-system-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # ── Redis — shared by the Go scheduler (Asynq queue) and the Java backend
  #    (rate-limit buckets, sandbox container tracking, fallback answer cache) ──
  redis:
    image: redis:7-alpine
    container_name: agent-system-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Garage (S3-compatible object storage for images) ──────────────────────────
  # garage.toml is rendered from observability/garage/garage.toml.template by
  # setup.sh (embeds the generated rpc_secret/admin_token). S3 API (3900) and
  # admin API (3903) stay on the internal docker network only.
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: agent-system-garage
    restart: unless-stopped
    volumes:
      - ./observability/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Image storage microservice (agent-system-storage-inner module) ───────────
  storage:
    build:
      context: ./backend
      dockerfile: agent-system-storage-inner/Dockerfile
    container_name: agent-system-storage
    ports:
      - "8083:8083"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      garage:
        condition: service_healthy
    secrets:
      - mysql_password
      - storage_service_key
      - garage_access_key
      - garage_secret_key
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-ragagent}
      MYSQL_USER: ${MYSQL_USER:-ragagent}
      GARAGE_S3_ENDPOINT: http://garage:3900
      GARAGE_REGION: ${GARAGE_REGION:-garage}
      GARAGE_BUCKET: ${GARAGE_BUCKET:-agent-system-images}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ── Notification consumer (agent-system-notification-consumer module) ────────
  # Email today (Resend), consumed from Kafka; more channels (Telegram, push, etc.)
  # land here later as new @KafkaListener methods.
  notification-consumer:
    build:
      context: ./backend
      dockerfile: agent-system-notification-consumer/Dockerfile
    container_name: agent-system-notification-consumer
    ports:
      - "8084:8084"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    secrets:
      - resend_api_key
      - resend_from_email
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ── Go scheduler microservice ─────────────────────────────────────────────────
  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: agent-system-scheduler
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    secrets:
      - scheduler_service_key
      - mysql_password
    environment:
      PORT: 8082
      REDIS_ADDR: redis:6379
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-ragagent}
      MYSQL_USER: ${MYSQL_USER:-ragagent}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      BACKEND_URL: http://backend:8081
      SCHEDULER_SERVICE_KEY_FILE: /run/secrets/scheduler_service_key
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Go investment-alert-task microservice (crypto/stock price, DeFi, and ────
  #    prediction-market alerts) ──────────────────────────────────────────────
  investment-alert-task:
    build:
      context: ./investment-alert-task
      dockerfile: Dockerfile
    container_name: agent-system-investment-alert-task
    ports:
      - "8085:8085"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    secrets:
      - alert_service_key
      - mysql_password
    environment:
      PORT: 8085
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-ragagent}
      MYSQL_USER: ${MYSQL_USER:-ragagent}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      BACKEND_URL: http://backend:8081
      ALERT_SERVICE_KEY_FILE: /run/secrets/alert_service_key
      PYTH_API_URL: ${PYTH_API_URL:-https://hermes.pyth.network}
      PYTH_API_KEY: ${PYTH_API_KEY:-}
      CHECK_INTERVAL: ${ALERT_CHECK_INTERVAL:-60}
      RULE_RELOAD_INTERVAL: ${ALERT_RULE_RELOAD_INTERVAL:-60}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Docker socket proxy ────────────────────────────────────────────────────────
  # Mediates the backend's access to the Docker API for SandboxService (spawns
  # ephemeral containers to run skill code). The backend never mounts the real
  # /var/run/docker.sock directly — only this proxy does — and the proxy is
  # restricted to the handful of endpoints SandboxService needs (container
  # lifecycle, exec, stats). This reduces, but does not fully eliminate, the
  # blast radius of an RCE/SSRF in the backend: container-create requests are
  # still allowed (required for sandboxing), so a compromised backend could in
  # principle create a privileged/host-bind-mounted container through it. For
  # full isolation, run the host's Docker daemon with userns-remap enabled
  # (rootless Docker), or move sandbox execution to a separate host/VM outside
  # the backend's blast radius.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: agent-system-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EXEC: 1
      POST: 1
      INFO: 1
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      BUILD: 0
      SWARM: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      SYSTEM: 0
      DISTRIBUTION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot backend (agent-system-rest module) ────────────────────────────
  # docker-entrypoint.sh reads /run/secrets/* → env vars before the JVM starts.
  backend:
    build:
      context: ./backend
      dockerfile: agent-system-rest/Dockerfile
    container_name: agent-system-backend
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      mysql:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    secrets:
      - mysql_password
      - weaviate_api_key
      - openai_api_key
      - anthropic_api_key
      - openrouter_api_key
      - auth_jwt_secret
      - finnhub_api_key
      - scheduler_service_key
      - storage_service_key
      - alert_service_key
      - google_client_id
      - google_client_secret
      - figma_client_id
      - figma_client_secret
      - telegram_bot_token
      - telegram_bot_username
    environment:
      # ── Non-secret config (safe to put inline) ──────────────────────────────
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-ragagent}
      MYSQL_USER: ${MYSQL_USER:-ragagent}
      # ── Weaviate
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: 8080
      # ── Redis (rate limiting, sandbox tracking, fallback cache — shared with scheduler's Asynq queue)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # ── Image storage (agent-system-storage-inner, Garage-backed)
      STORAGE_URL: http://storage:8083
      # ── Investment alerts (crypto/stock price, DeFi, prediction-market)
      ALERT_URL: http://investment-alert-task:8085
      # ── Notifications (agent-system-notification-consumer, Resend-backed email via Kafka)
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # ── LLM
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      # Embeddings use Ollama (nomic-embed-text) running on the host.
      # Switch to EMBEDDING_PROVIDER=openai if you prefer OpenAI text-embedding-3-small.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openrouter}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-6}
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-openai/gpt-4o-mini}"
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-qwen/qwen3-embedding-4b}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://host.docker.internal:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-nomic-embed-text}
      # ── Auth (non-secret flags)
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_JWT_EXPIRY_HOURS: ${AUTH_JWT_EXPIRY_HOURS:-24}
      AUTH_OTP_EXPIRY_MINUTES: ${AUTH_OTP_EXPIRY_MINUTES:-10}
      # ── Admin (comma-separated emails allowed to manage orgs system-wide)
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # ── MCP transport auth (blank = /mcp/** closed; only set if you use MCP clients)
      MCP_API_KEY: ${MCP_API_KEY:-}
      MCP_EMAIL: ${MCP_EMAIL:-}
      # ── Client identity
      CLIENT_IDENTITY_ENABLED: ${CLIENT_IDENTITY_ENABLED:-false}
      CLIENT_IOS_SECRET: ${CLIENT_IOS_SECRET:-}
      CLIENT_WEB_SECRET: ${CLIENT_WEB_SECRET:-}
      # ── Passkey (WebAuthn)
      AUTH_PASSKEY_RP_ID: ${AUTH_PASSKEY_RP_ID:-localhost}
      AUTH_PASSKEY_RP_NAME: ${AUTH_PASSKEY_RP_NAME:-RAG Agent}
      AUTH_PASSKEY_ORIGIN: ${AUTH_PASSKEY_ORIGIN:-http://localhost:3000}
      # ── Financial / Market data (FINNHUB_API_KEY comes from secrets)
      # ── Travel (no secrets — records stored in MySQL, map tiles via CartoDB)
      # ── Distributed tracing (disabled — no OTEL collector in this stack)
      # To enable: add an OTEL collector service, then set:
      #   TRACING_SAMPLE_RATE=1.0
      #   OTEL_EXPORTER_OTLP_ENDPOINT=http://<collector>:4318/v1/traces
      TRACING_SAMPLE_RATE: "0.0"
      # ── Web fetch
      WEB_FETCH_ENABLED: ${WEB_FETCH_ENABLED:-true}
      WEB_FETCH_TIMEOUT: ${WEB_FETCH_TIMEOUT:-10}
      WEB_FETCH_MAX_CHARS: ${WEB_FETCH_MAX_CHARS:-50000}
      # ── Connectors (credentials come from secrets; TELEGRAM_BOT_USERNAME is non-secret)
      CONNECTOR_CALLBACK_BASE_URL: ${CONNECTOR_CALLBACK_BASE_URL:-http://localhost:3000}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # ── Sandbox (SandboxService talks to Docker through the restricted proxy
      # below instead of mounting the host socket directly)
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  # ── Next.js frontend ──────────────────────────────────────────────────────────
  # No secrets needed — the frontend only talks to the backend/scheduler, never
  # directly to any external API.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8081
        AUTH_ENABLED: ${AUTH_ENABLED:-true}
        AUTH_JWT_EXPIRY_HOURS: ${AUTH_JWT_EXPIRY_HOURS:-24}
    container_name: agent-system-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8081
      SCHEDULER_URL: http://scheduler:8082
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_JWT_EXPIRY_HOURS: ${AUTH_JWT_EXPIRY_HOURS:-24}
      CLIENT_WEB_SECRET: ${CLIENT_WEB_SECRET:-}

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: agent-system-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # ── Loki (log aggregation backend) ───────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: agent-system-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  # ── Promtail (scrapes Docker container logs → Loki) ───────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: agent-system-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./observability/promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: agent-system-grafana
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ID: "1"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Admin"
      # GitHub OAuth — only existing Grafana users (matched by email) can authenticate
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://metric.skyproton.com}
      GF_AUTH_GITHUB_ENABLED: "true"
      GF_AUTH_GITHUB_CLIENT_ID: ${GRAFANA_GITHUB_CLIENT_ID}
      GF_AUTH_GITHUB_CLIENT_SECRET: ${GRAFANA_GITHUB_CLIENT_SECRET}
      GF_AUTH_GITHUB_SCOPES: "user:email,read:org"
      GF_AUTH_GITHUB_AUTH_URL: "https://github.com/login/oauth/authorize"
      GF_AUTH_GITHUB_TOKEN_URL: "https://github.com/login/oauth/access_token"
      GF_AUTH_GITHUB_API_URL: "https://api.github.com/user"
      GF_AUTH_GITHUB_ALLOW_SIGN_UP: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

volumes:
  weaviate_data:
  mysql_data:
  garage_meta:
  garage_data:
  prometheus_data:
  grafana_data:
  loki_data:
