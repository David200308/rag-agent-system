name: Agent CLI CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'agent-cli/**'
      - '.github/workflows/agent-cli-ci.yml'
    tags:
      - 'agent-cli/v*'
  pull_request:
    branches: [main]
    paths:
      - 'agent-cli/**'
      - '.github/workflows/agent-cli-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: agent-cli

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent-cli/go.mod
          cache-dependency-path: agent-cli/go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  # ── Test ──────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent-cli/go.mod
          cache-dependency-path: agent-cli/go.sum

      - name: Run tests
        run: go test -v -race ./...

  # ── Cross-platform release ────────────────────────────────────────────────────
  # Runs only on cli/v* tags. Builds binaries for all platforms, then creates
  # a GitHub Release with the binaries and a SHA256 checksums file attached.
  release:
    name: Release (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/agent-cli/v')

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent-cli/go.mod
          cache-dependency-path: agent-cli/go.sum

      - name: Extract version from tag
        id: version
        # tag format: cli/v1.2.3  →  version: 1.2.3
        run: echo "version=${GITHUB_REF_NAME#agent-cli/}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GOOS:   ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY="agent-cli_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}"
          go build \
            -ldflags "-s -w -X agent-cli/cmd.Version=${{ steps.version.outputs.version }}" \
            -o "$BINARY" \
            .
          echo "BINARY=$BINARY" >> "$GITHUB_ENV"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-cli_${{ matrix.goos }}_${{ matrix.goarch }}
          path: agent-cli/${{ env.BINARY }}
          retention-days: 1

  # ── Create GitHub Release ─────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/agent-cli/v')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: agent-cli_*
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum agent-cli_* > checksums.txt && cat checksums.txt

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#agent-cli/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: agent-cli ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## agent-cli ${{ steps.version.outputs.version }}

            ### Install

            **macOS (Apple Silicon)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/agent-cli_darwin_arm64 \
              -o agent-cli && chmod +x agent-cli && sudo mv agent-cli /usr/local/bin/
            ```

            **macOS (Intel)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/agent-cli_darwin_amd64 \
              -o agent-cli && chmod +x agent-cli && sudo mv agent-cli /usr/local/bin/
            ```

            **Linux (amd64)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/agent-cli_linux_amd64 \
              -o agent-cli && chmod +x agent-cli && sudo mv agent-cli /usr/local/bin/
            ```

            **Windows** — download `agent-cli_windows_amd64.exe` from the assets below.

            ### First-time setup
            ```bash
            agent-cli auth config --url https://api.agent.skyproton.com
            agent-cli auth login
            ```

            ### Verify download
            ```bash
            sha256sum -c checksums.txt
            ```
          files: |
            dist/agent-cli_*
            dist/checksums.txt
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
