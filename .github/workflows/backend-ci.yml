name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/agent-system-rest/src/**'
      - 'backend/agent-system-rest/pom.xml'
      - 'backend/agent-system-rest/Dockerfile'
      - 'backend/agent-system-storage-inner/src/**'
      - 'backend/agent-system-storage-inner/pom.xml'
      - 'backend/agent-system-storage-inner/Dockerfile'
      - 'backend/pom.xml'
      - 'backend/docker-entrypoint.sh'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/agent-system-rest/src/**'
      - 'backend/agent-system-rest/pom.xml'
      - 'backend/agent-system-rest/Dockerfile'
      - 'backend/agent-system-storage-inner/src/**'
      - 'backend/agent-system-storage-inner/pom.xml'
      - 'backend/agent-system-storage-inner/Dockerfile'
      - 'backend/pom.xml'
      - 'backend/docker-entrypoint.sh'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_REST: ${{ github.repository }}/rag-agent-system-backend
  IMAGE_NAME_STORAGE: ${{ github.repository }}/rag-agent-system-storage-inner

jobs:
  # ── Test ────────────────────────────────────────────────────────────────────
  # Runs from the multi-module reactor root, so it builds/tests both
  # agent-system-rest and agent-system-storage-inner in one pass.
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with coverage
        working-directory: backend
        run: mvn test -B

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/agent-system-rest/target/surefire-reports/
            backend/agent-system-storage-inner/target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/agent-system-rest/target/site/jacoco/
          retention-days: 7

      - name: Coverage summary
        if: always()
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: backend/agent-system-rest/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: Test Coverage

  # ── Build & Push Docker images ───────────────────────────────────────────────
  docker-rest:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    needs: test
    # Run on push/dispatch to main only — skip on pull requests
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Buildx must be set up before login so credentials propagate into the builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_REST }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/agent-system-rest/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Disable OCI attestation manifests — GHCR rejects them when using
          # GITHUB_TOKEN, causing the push to fail silently with no image produced.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=backend-rest
          cache-to: type=gha,mode=max,scope=backend-rest

  docker-storage:
    name: Build & Push Storage Image
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_STORAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/agent-system-storage-inner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=backend-storage
          cache-to: type=gha,mode=max,scope=backend-storage
