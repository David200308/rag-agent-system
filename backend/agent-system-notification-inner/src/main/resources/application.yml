spring:
  application:
    name: agent-system-notification-inner

  config:
    import:
      - optional:classpath:application.local.yml

server:
  port: 8084

# ── Resend (transactional email) ──────────────────────────────────────────────
resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:noreply@example.com}

# ── Shared secret expected on X-Notification-Key from agent-system-rest;
#    logo-url is the branding image used in the email template header ───────
notification:
  service-key: ${NOTIFICATION_SERVICE_KEY:notification-secret-key}
  email:
    logo-url: ${NOTIFICATION_EMAIL_LOGO_URL:https://www.skyproton.com/_next/static/media/logo-black-front-no-background.0acya-sxbgd9s.svg}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.agentsystem.notification: DEBUG
