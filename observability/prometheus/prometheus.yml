global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    project: rag-agent-system

scrape_configs:

  - job_name: rag-agent-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: backend

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
